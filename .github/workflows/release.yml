name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # needed to create releases

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tabboz-windows-x64.zip
            binary: tabboz.exe
          - name: macos-arm64
            os: macos-latest # Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            artifact: tabboz-macos-arm64.tar.gz
            binary: tabboz
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tabboz-linux-x64.tar.gz
            binary: tabboz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev \
            libxcb1-dev libxkbcommon-dev libwayland-dev

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p tabboz-app

      - name: Package (Windows)
        if: matrix.name == 'windows-x64'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          7z a "${{ github.workspace }}/${{ matrix.artifact }}" tabboz.exe

      - name: Package (macOS / Linux)
        if: matrix.name != 'windows-x64'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "${{ github.workspace }}/${{ matrix.artifact }}" ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ github.workspace }}/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum tabboz-*.zip tabboz-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Generate release tag (date, with duplicate handling)
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TAG="$DATE"
          # Same-day second push: append the time (YYYY-MM-DD-HHMM)
          if gh release view "$TAG" &>/dev/null; then
            TAG="${DATE}-$(date +%H%M)"
          fi
          # Same-minute third push: append the short commit SHA
          if gh release view "$TAG" &>/dev/null; then
            TAG="${DATE}-${GITHUB_SHA:0:7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Tabboz Simulator ${{ steps.tag.outputs.date }}"
          files: dist/*
          generate_release_notes: true
