# Tabboz Simulator - Rust port

# Tabboz Simulator 1997-2000 Andrea Bonomi; this port is GPL-3.0-or-later.

[package]
name = "tabboz-app"
description = "Tabboz Simulator: macOS application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tabboz"
path = "src/main.rs"

[dependencies]
dirs = "6"
raw-window-handle = "0.6"
rodio = "0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
softbuffer = "0.4.8"
tabboz-core = { path = "../tabboz-core" }
tabboz-win = { path = "../tabboz-win" }
winit = "0.30.13"
